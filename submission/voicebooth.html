<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Booth · Fleet Command</title>
<!-- The piece-by-piece recording booth for the demo voice over. Local only,
     never deployed. Fourteen speaking pieces, each recorded alone against its
     own slice of the silent film, re-takeable forever. Times come from
     submission/marks.json. Saved pieces are named fleetcommand-vo-NN.webm and
     ffmpeg lays each one onto the film at its piece's mark afterwards, so a
     piece recorded slightly long is a mixing note, not a retake. -->
<style>
:root{
  --bg:#0b0e15; --surf:#141926; --line:#232b45; --ink:#eef1fb; --muted:#8b93af;
  --indigo:#7c6cff; --teal:#2dd4bf; --amber:#f5b23d; --red:#ff5470;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,'Segoe UI',sans-serif;
  height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:1rem;padding:.6rem 1.2rem;border-bottom:1px solid var(--line)}
header h1{font-size:1.05rem;letter-spacing:.06em}
header h1 b{color:var(--indigo)}
.meter{flex:1;max-width:300px;height:14px;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:#0d1119}
.meter i{display:block;height:100%;width:0%;background:var(--teal)}
.mstate{font-size:.8rem;color:var(--muted)}
.done-count{margin-left:auto;font-weight:700;color:var(--teal)}
.wrap{flex:1;display:grid;grid-template-columns:290px 1fr;min-height:0}
nav{border-right:1px solid var(--line);overflow-y:auto;padding:.6rem}
.piece{display:flex;gap:.6em;align-items:center;width:100%;text-align:left;background:none;
  border:1px solid transparent;border-radius:.5em;padding:.5em .6em;color:var(--muted);
  cursor:pointer;font:inherit;font-size:.82rem}
.piece:hover{border-color:var(--line)}
.piece.current{border-color:var(--indigo);color:var(--ink);background:rgba(124,108,255,.08)}
.piece .n{font-variant-numeric:tabular-nums;color:var(--muted);width:1.6em}
.piece .ok{margin-left:auto;color:var(--teal);visibility:hidden}
.piece.has .ok{visibility:visible}
.main{display:grid;grid-template-rows:minmax(0,46%) minmax(0,54%);min-height:0}
.filmwrap{position:relative;background:#000;display:flex;justify-content:center}
video{height:100%;max-width:100%}
.count{position:absolute;inset:0;display:none;place-items:center;font-size:8rem;font-weight:800;
  background:rgba(11,14,21,.75);z-index:5}
.count.on{display:grid}
.card{padding:1rem 4vw;display:flex;flex-direction:column;gap:.8rem;min-height:0;overflow-y:auto}
.cuelabel{font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
#lineText{font-size:clamp(1.25rem,2.4vw,2rem);line-height:1.5;font-weight:600}
.hint{color:var(--muted);font-size:.9rem}
.controls{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:auto;padding-top:.6rem}
button{font:inherit;font-weight:700;border:0;border-radius:.6em;padding:.75em 1.4em;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
.ghost{background:var(--surf);color:var(--ink);border:1px solid var(--line)}
#recBtn{background:var(--red);color:#fff}
#hearBtn{background:var(--surf);color:var(--teal);border:1px solid var(--teal)}
#saveAll{background:var(--teal);color:#04211d}
.flash{animation:flash 1s infinite}
@keyframes flash{50%{opacity:.4}}
</style>
</head>
<body>
<header>
  <h1>VOICE <b>BOOTH</b> · piece by piece</h1>
  <div class="meter"><i id="level"></i></div>
  <span class="mstate" id="mstate">Step 1: press "Mic check".</span>
  <span class="done-count" id="doneCount">0 / 14</span>
</header>

<div class="wrap">
  <nav id="nav"></nav>
  <div class="main">
    <div class="filmwrap">
      <video id="film" src="fleetcommand-demo.mp4" muted playsinline preload="auto"></video>
      <div class="count" id="count">3</div>
    </div>
    <div class="card">
      <div class="cuelabel" id="lineLabel"></div>
      <div id="lineText"></div>
      <div class="hint" id="lineHint"></div>
      <div class="controls">
        <button id="micBtn" class="ghost">🎙 Mic check</button>
        <button id="watchBtn" class="ghost" disabled>▶ Watch this part</button>
        <button id="recBtn" disabled>● Record this line</button>
        <button id="hearBtn" disabled>🔁 Hear my take with the picture</button>
        <button id="saveAll" class="ghost" disabled>⬇ Save all pieces</button>
      </div>
    </div>
  </div>
</div>

<script>
// Speaking pieces only. t/until with two decimals come from submission/marks.json
// (the rig measured them; never retype). `until` is the window the line should
// land in; recording runs 1.5s past it as grace, because the mix lays pieces at
// absolute marks and a slightly long tail is fine unless it reaches the next line.
const PIECES = [
  {t:3.51,  until:9.80,  label:'1 · The hook, over the slam', hint:'Small pause where the dots are. Let the drained screen breathe.', text:'That is an AI crew stopping itself. … It did the work. Then it refused to ship it without a person.'},
  {t:9.80,  until:14.80, label:'2 · The reset', hint:'Just this one line, easy.', text:'Here is how it got there.'},
  {t:14.80, until:22.89, label:'3 · The crew', hint:'Steady pace. You have 8 seconds.', text:'If you run a small business you cannot afford an operations crew. Nobody watches your site, and you find out it is broken from a customer. So we built one: SCOUT does reconnaissance, AUDIT ranks what it finds, MEDIC drafts the fix, SHIP stages the deploy.'},
  {t:22.89, until:42.43, label:'4 · The target', hint:'The mission starts running on screen as you say this.', text:'Today’s target is a bakery site we broke on purpose: a dead order form, no security headers, a six second load.'},
  {t:42.43, until:62.00, label:'5 · The market lens', hint:'The MARKET / SERPAPI entry is landing under SCOUT as you talk.', text:'SCOUT does not just read the site. It reads the market around it, live through SerpApi. And that changes the finding: the order form posting into a dead route is not just a bug, it is a bug in the exact place every competitor is winning. Every order this bakery takes is silently vanishing.'},
  {t:62.00, until:82.00, label:'6 · AUDIT finishes', hint:'Calm, like reading a scoreboard.', text:'AUDIT ranks the defects. High, medium, low. The dead order route is on top because it is the one actively costing money.'},
  {t:82.00, until:100.00, label:'7 · MEDIC finishes', hint:'"Drafted, not applied" is the point. Lean on it.', text:'MEDIC writes the actual fix. That is a real diff: repoint the form, add the handler. Drafted, not applied. MEDIC never touches production.'},
  {t:100.00,until:115.50, label:'8 · The honesty line', hint:'This one wins judges. Say it like you mean it, because we do.', text:'Those chips say replay and sample. This run is a recording and the app labels it rather than faking a live call. Arm the keys and the identical code path goes live. We would rather show you a labelled sample than lie to you.'},
  {t:119.50,until:130.35, label:'9 · The gate, earned', hint:'The slam happens 2s before you start. It already landed; now explain it.', text:'And there it is. SHIP staged the deploy, summarized the risk, and stopped. It is holding for a human, and the hold is structural. The agent has no code path forward until a person decides. Notice the screen: everything else just stepped back, and the only lit control left is the one that belongs to you.'},
  {t:130.35,until:136.07, label:'10 · The second risk', hint:'A little surprised, like SHIP caught something real. It did.', text:'And SHIP raised something nobody asked it to. It checked with name.com, and this bakery does not own its own name. It is about to start taking money online on a domain anyone could register tomorrow. That is a person’s decision, not software’s.'},
  {t:136.07,until:144.45, label:'11 · Send back', hint:'The cursor hovers Send back on screen.', text:'I can send it back, and MEDIC revises with my objection attached.'},
  {t:144.45,until:150.36, label:'12 · Approve', hint:'The line of the whole video. Slow down on the last sentence.', text:'Or I approve, and only then does anything release. AI does the work. A person holds the trigger. The gate is not a limitation of the product. The gate is the product.'},
  {t:150.36,until:157.99, label:'13 · Why it is real', hint:'Confident, matter-of-fact.', text:'This is not a demo concept. The same engine runs our private production ops room across dozens of live sites today. What you are looking at is the public version: Cloudflare Pages and Functions, SerpApi, name.com, zero dependencies, one screen, no scroll.'},
  {t:157.99,until:161.99, label:'14 · The close', hint:'Land it and stop. Four seconds is plenty.', text:'Fleet Command. An AI ops crew that does the work, and a human gate that holds the trigger.'},
];
const GRACE = 1.5;

const film = document.getElementById('film');
const count = document.getElementById('count');
const level = document.getElementById('level');
const mstate = document.getElementById('mstate');
const doneCount = document.getElementById('doneCount');
const nav = document.getElementById('nav');
const lineLabel = document.getElementById('lineLabel');
const lineText = document.getElementById('lineText');
const lineHint = document.getElementById('lineHint');
const micBtn = document.getElementById('micBtn');
const watchBtn = document.getElementById('watchBtn');
const recBtn = document.getElementById('recBtn');
const hearBtn = document.getElementById('hearBtn');
const saveAll = document.getElementById('saveAll');

let stream = null, recorder = null, chunks = [];
let takes = new Array(PIECES.length).fill(null);
let cur = 0, playTimer = 0, playback = null, busy = false;

function renderNav(){
  nav.innerHTML = '';
  PIECES.forEach((p, i) => {
    const b = document.createElement('button');
    b.className = 'piece' + (i === cur ? ' current' : '') + (takes[i] ? ' has' : '');
    b.innerHTML = '<span class="n">' + (i+1) + '</span><span>' + p.label.replace(/^\d+ · /,'') + '</span><span class="ok">✔</span>';
    b.addEventListener('click', () => { if(!busy) select(i); });
    nav.appendChild(b);
  });
  const n = takes.filter(Boolean).length;
  doneCount.textContent = n + ' / ' + PIECES.length;
  saveAll.disabled = n === 0;
  if(n === PIECES.length) doneCount.textContent = '14 / 14 🎉';
}

function select(i){
  cur = i;
  const p = PIECES[i];
  lineLabel.textContent = 'PIECE ' + p.label + '  ·  window ' + (p.until - p.t).toFixed(0) + 's';
  lineText.textContent = p.text;
  lineHint.textContent = p.hint + (takes[i] ? '  ·  You already have a take for this one; recording again replaces it.' : '');
  hearBtn.disabled = !takes[i] || !stream;
  stopSegment();
  film.currentTime = p.t;
  renderNav();
}

function stopSegment(){
  film.pause();
  clearInterval(playTimer);
  if(playback){ playback.pause(); playback = null; }
}

function playSegment(from, to, then){
  film.currentTime = from;
  film.play();
  playTimer = setInterval(() => {
    if(film.currentTime >= to){ stopSegment(); if(then) then(); }
  }, 60);
}

micBtn.addEventListener('click', async () => {
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation:false, noiseSuppression:false, autoGainControl:false}});
  }catch(e){
    mstate.textContent = 'Mic blocked. Click the 🎤 in the address bar, allow, then retry.';
    return;
  }
  const ctx = new AudioContext();
  const an = ctx.createAnalyser(); an.fftSize = 512;
  ctx.createMediaStreamSource(stream).connect(an);
  const buf = new Uint8Array(an.frequencyBinCount);
  (function loop(){
    an.getByteFrequencyData(buf);
    const v = Math.min(100, Math.round(buf.reduce((a,b)=>a+b,0)/buf.length*1.6));
    level.style.width = v + '%';
    level.style.background = v > 4 ? 'var(--teal)' : '#565f7c';
    requestAnimationFrame(loop);
  })();
  mstate.textContent = 'Talk. Green bounce = mic hears you.';
  micBtn.textContent = '🎙 Mic is on';
  watchBtn.disabled = false; recBtn.disabled = false;
  hearBtn.disabled = !takes[cur];
});

watchBtn.addEventListener('click', () => {
  if(busy) return;
  stopSegment();
  playSegment(PIECES[cur].t, PIECES[cur].until);
});

recBtn.addEventListener('click', async () => {
  if(busy) return;
  busy = true; stopSegment();
  const p = PIECES[cur];
  film.currentTime = p.t;
  for(const n of ['3','2','1']){
    count.textContent = n; count.classList.add('on');
    await new Promise(r => setTimeout(r, 800));
  }
  count.classList.remove('on');
  chunks = [];
  recorder = new MediaRecorder(stream, {mimeType:'audio/webm;codecs=opus', audioBitsPerSecond:160000});
  recorder.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    takes[cur] = new Blob(chunks, {type:'audio/webm'});
    mstate.classList.remove('flash');
    mstate.textContent = 'Got it (' + Math.round(takes[cur].size/1024) + ' KB). Hear it back, or move on.';
    hearBtn.disabled = false;
    busy = false;
    renderNav(); select(cur);
  };
  recorder.start(150);
  mstate.textContent = '● RECORDING piece ' + (cur+1) + '. Read the big line.';
  mstate.classList.add('flash');
  playSegment(p.t, Math.min(p.until + GRACE, film.duration - 0.05), () => {
    if(recorder.state === 'recording') recorder.stop();
  });
});

hearBtn.addEventListener('click', () => {
  if(busy || !takes[cur]) return;
  stopSegment();
  const p = PIECES[cur];
  playback = new Audio(URL.createObjectURL(takes[cur]));
  playback.play();
  playSegment(p.t, Math.min(p.until + GRACE, film.duration - 0.05));
  mstate.textContent = 'Playing your take over the picture. Like it? Next piece. No? Record again.';
});

saveAll.addEventListener('click', () => {
  let n = 0;
  takes.forEach((b, i) => {
    if(!b) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'fleetcommand-vo-' + String(i+1).padStart(2,'0') + '.webm';
    a.click(); n++;
  });
  mstate.textContent = n + ' pieces saved to Downloads. If Chrome asks about multiple downloads, click Allow. Then tell Claude: done.';
});

renderNav();
select(0);
</script>
</body>
</html>
