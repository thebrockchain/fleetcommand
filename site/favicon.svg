<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fleet Command mark: the four agent crew above, the gate check below.
       Brand tokens only (indigo 7c6cff to teal 2dd4bf on charcoal 0d1018). -->
  <rect width="64" height="64" rx="14" fill="#0d1018"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c6cff"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>
  <g fill="url(#g)">
    <circle cx="18" cy="20" r="4"/>
    <circle cx="30" cy="20" r="4"/>
    <circle cx="42" cy="20" r="4"/>
    <circle cx="54" cy="20" r="0"/>
  </g>
  <path d="M14 34h36" stroke="url(#g)" stroke-width="4" stroke-linecap="round"/>
  <path d="M20 45l7 7 15-16" stroke="#2dd4bf" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
